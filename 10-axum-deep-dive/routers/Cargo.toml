[package]
name = "axum-routers"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A single binary that runs each example behind a `--example` flag
[[bin]]
name = "01_basic_routes"
path = "src/01_basic_routes.rs"

[[bin]]
name = "02_path_and_query"
path = "src/02_path_and_query.rs"

[[bin]]
name = "03_nested_routers"
path = "src/03_nested_routers.rs"

[[bin]]
name = "04_state_sharing"
path = "src/04_state_sharing.rs"

[[bin]]
name = "05_into_response"
path = "src/05_into_response.rs"
