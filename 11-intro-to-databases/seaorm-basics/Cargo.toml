[package]
name = "seaorm-basics"
version = "0.1.0"
edition = "2024"

[dependencies]
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "mock", # enables MockDatabase for the 07_mock_tests example
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
anyhow = "1"

[lib]
name = "seaorm_basics"
path = "src/lib.rs"

[[bin]]
name = "01_connect"
path = "src/01_connect.rs"

[[bin]]
name = "02_entities_crud"
path = "src/02_entities_crud.rs"

[[bin]]
name = "03_relations"
path = "src/03_relations.rs"

[[bin]]
name = "04_filters_pagination"
path = "src/04_filters_pagination.rs"

[[bin]]
name = "05_joins"
path = "src/05_joins.rs"

[[bin]]
name = "06_custom_queries"
path = "src/06_custom_queries.rs"

[[bin]]
name = "07_mock_tests"
path = "src/07_mock_tests.rs"